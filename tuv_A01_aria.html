
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ARIA | TÜV Rheinland</title>

    <meta
        name="description"
        content="Accede a ARIA para registrar la disponibilidad de tus servicios de auditoría."
    >

    <link
        rel="icon"
        type="image/png"
        href="/assets/ICONO_ARIA.png"
    >

    <!-- ======================================== -->
    <!-- ESTILOS CSS                              -->
    <!-- ======================================== -->

    <style>

        :root {
            color-scheme: light;

            --aria-blue: #075985;
            --aria-blue-light: #d9f3fa;
            --aria-text: #174b65;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            height: 100%;
        }

        body {
            margin: 0;
            height: 100vh;
            height: 100dvh;

            display: flex;
            flex-direction: column;

            overflow: hidden;

            background: #f4f8fb;

            font-family:
                system-ui,
                -apple-system,
                "Segoe UI",
                sans-serif;
        }

        /* ===================================== */
        /* HEADER - ARIA                         */
        /* ===================================== */

        .aria-navbar {
            flex: 0 0 auto;

            display: flex;
            align-items: center;

            min-height: 76px;

            padding: 12px clamp(16px, 4vw, 64px);

            padding-top: max(
                12px,
                env(safe-area-inset-top)
            );

            /* Degradado azul claro a azul oscuro */

            background: linear-gradient(
                90deg,
                #d9f3fa 0%,
                #8dc9dd 38%,
                #3285a8 70%,
                #075985 100%
            );

            border-bottom:
                1px solid rgba(255, 255, 255, 0.25);
        }

        /* ===================================== */
        /* LOGOTIPO Y NOMBRE                     */
        /* ===================================== */

        .aria-brand {
            display: inline-flex;
            align-items: center;

            gap: 16px;

            max-width: 100%;

            color: var(--aria-text);
            text-decoration: none;
        }

        .aria-brand-text {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.35;

            color: var(--aria-text);
        }

        .aria-brand:focus-visible {
            outline: 2px solid var(--aria-blue);
            outline-offset: 5px;
            border-radius: 4px;
        }

        .aria-brand-logo {
            display: block;

            width: 108px;
            height: 48px;

            object-fit: contain;
            flex-shrink: 0;
        }

        /* ===================================== */
        /* CONTENEDOR DE LA WEBAPP ARIA          */
        /* ===================================== */

        .aria-viewer {
            display: flex;

            flex: 1 1 0;

            min-height: 0;
            width: 100%;
        }

        /* ===================================== */
        /* IFRAME DE GOOGLE APPS SCRIPT          */
        /* ===================================== */

        .aria-frame {
            display: block;

            flex: 1 1 0;

            width: 100%;
            height: 100%;

            min-width: 0;

            border: 0;

            background: #ffffff;
        }

        /* ===================================== */
        /* DISEÑO RESPONSIVO - TABLET Y MÓVIL    */
        /* ===================================== */

        @media (max-width: 600px) {

            .aria-navbar {
                min-height: 68px;

                padding: 10px 16px;

                padding-top: max(
                    10px,
                    env(safe-area-inset-top)
                );
            }

            .aria-brand {
                gap: 12px;
            }

            .aria-brand-logo {
                width: 86px;
                height: 42px;
            }

            .aria-brand-text {
                max-width: 210px;
                font-size: 12px;
            }

        }

        /* ===================================== */
        /* DISEÑO RESPONSIVO - MÓVILES PEQUEÑOS  */
        /* ===================================== */

        @media (max-width: 360px) {

            .aria-brand-logo {
                width: 72px;
            }

            .aria-brand-text {
                font-size: 11px;
            }

        }

    </style>

</head>

<body>

    <!-- ======================================== -->
    <!-- ENCABEZADO PRINCIPAL ARIA               -->
    <!-- ======================================== -->

    <header class="aria-navbar" id="aria-navbar">

        <a
            href="http://tuvrheinland.dapanalytics.com/"
            class="aria-brand"
            aria-label="Ir al inicio de DAP"
        >

            <!-- Logotipo TÜV Rheinland -->

            <img
                class="aria-brand-logo"
                src="/assets/Tuv_Logo_1.png"
                alt="TÜV Rheinland"
            >

            <!-- Nombre del área -->

            <span class="aria-brand-text">
                A01 | Certification of Management System
            </span>

        </a>

    </header>

    <!-- ======================================== -->
    <!-- APLICACIÓN ARIA                         -->
    <!-- ======================================== -->

    <main
        class="aria-viewer"
        aria-label="ARIA | Auditor Resource & Integrated Availability"
    >

        <!-- WebApp de Google Apps Script -->

        <iframe
            class="aria-frame"
            src="https://script.google.com/a/~/macros/s/AKfycbysTMWX2EWPNa294KPaskFG-TOuJeUZls6eafYftB8I_OwI7j536IqxsbTPGC_mwahcDg/exec"
            title="ARIA | TÜV Rheinland A01"
            allow="fullscreen"
            allowfullscreen
        >
        </iframe>

    </main>

</body>

</html>
